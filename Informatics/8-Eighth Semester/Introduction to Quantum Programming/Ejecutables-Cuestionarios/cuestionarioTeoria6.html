    <script>
        const quizData = [
            {
                question: "Si un qubit tiene un espacio de Hilbert de dimensión 2, ¿cuál es la dimensión del espacio de Hilbert de un sistema de 3 qubits?",
                options: ["6 (2+2+2)", "8 (2x2x2)", "9 (3^2)", "5 (2+3)"],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Las dimensiones no se suman.",
                    "¡Correcto! La dimensión del espacio compuesto es el producto de las dimensiones de los espacios individuales. Para N qubits, la dimensión es 2^N.",
                    "Incorrecto. El número de qubits no es la base de la potencia.",
                    "Incorrecto."
                ],
                hint: "La dimensión de un espacio compuesto se obtiene multiplicando, no sumando, las dimensiones individuales.",
                theoryHTML: `<h2>El Espacio Compuesto: \\(\\mathcal{H} = \\mathcal{H}_1 \\otimes \\mathcal{H}_2\\)</h2>
                    <p><b>La Regla Clave: Multiplicación de Dimensiones</b></p>
                    <p>La dimensión del nuevo espacio compuesto es el <b>producto</b> de las dimensiones de los espacios originales. Si \\(\\text{dim}(\\mathcal{H}_1) = N_1\\) y \\(\\text{dim}(\\mathcal{H}_2) = N_2\\), entonces:</p>
                    <p style="text-align:center;">\\( \\text{dim}(\\mathcal{H}) = N_1 \\cdot N_2 \\)</p>
                    <p>Esto explica el crecimiento exponencial del poder computacional. Cada qubit que añadimos (dimensión 2) <b>multiplica</b> el tamaño del espacio de estados.</p>`
            },
            {
                question: "¿Qué es un 'estado producto' (o separable)?",
                options: ["Un estado que no puede ser factorizado.", "Un estado en el que cada subsistema puede ser descrito de forma independiente.", "Un estado que resulta de la suma de dos kets.", "Un estado que siempre se encuentra en la base computacional."],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Un estado que no puede ser factorizado se llama estado entrelazado.",
                    "¡Correcto! Un estado producto es aquel que se puede escribir como el producto tensorial de los estados de sus subsistemas, como \\(|\\psi\\rangle = |\\phi\\rangle \\otimes |\\chi\\rangle\\).",
                    "Incorrecto. La suma de kets crea una superposición, no necesariamente un estado producto.",
                    "Incorrecto. Los estados producto pueden estar formados por superposiciones, como \\(|+\\rangle|+\\rangle\\)."
                ],
                hint: "El nombre 'producto' da una pista sobre cómo se construye.",
                theoryHTML: `<h2>Estados Producto (o Separables)</h2>
                    <p>Aquellos estados en los que cada subsistema puede ser descrito de forma independiente se llaman <b>estados producto</b> (o separables).</p>
                    <p>Estos estados se construyen tomando el producto tensorial de los vectores de estado de los espacios individuales.</p>
                    <p>Si tenemos un estado \\(|\\phi\\rangle \\in \\mathcal{H}_1\\) y un estado \\(|\\chi\\rangle \\in \\mathcal{H}_2\\), su estado producto \\(|\\psi\\rangle \\in \\mathcal{H}\\) es:</p>
                    <p style="text-align:center;">\\( |\\psi\\rangle = |\\phi\\rangle \\otimes |\\chi\\rangle \\)</p>`
            },
            {
                question: "Según la convención de notación, ¿cómo se abrevia el estado \\(|0\\rangle \\otimes |1\\rangle\\)?",
                options: ["\\(|0+1\\rangle\\)", "\\(|0\\rangle|1\\rangle\\)", "\\(|01\\rangle\\)", "No se puede abreviar."],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. La suma se usa para superposiciones, no para productos tensoriales.",
                    "Incorrecto. Aunque omitir el símbolo \\(\\otimes\\) es una abreviatura válida (\\(|0\\rangle|1\\rangle\\)), hay una convención más específica para la base computacional.",
                    "¡Correcto! Para la base computacional, la convención es fusionar los kets concatenando sus etiquetas. \\(|0\\rangle \\otimes |1\\rangle \\equiv |01\\rangle\\).",
                    "Incorrecto. Existen convenciones estándar para simplificar la notación."
                ],
                hint: "Para la base computacional, las etiquetas de los kets se fusionan.",
                theoryHTML: `<h2>Notación Abreviada: Dos Convenciones Clave</h2>
                    <ol>
                        <li><b>Omisión del Símbolo \\(\\otimes\\) (Regla General):</b> \\( |\\phi\\rangle \\otimes |\\chi\\rangle \\equiv |\\phi\\rangle|\\chi\\rangle \\)</li>
                        <li><b>Fusión de Kets (Regla Específica):</b> Para la <b>base computacional</b>, las etiquetas de los kets se concatenan en uno solo.
                        <p style="text-align:center;">\\( |a\\rangle \\otimes |b\\rangle \\equiv |ab\\rangle \\quad \\text{(donde } a, b \\in \\{0, 1\\}\\text{)} \\)</p>
                        </li>
                    </ol>`
            },
            {
                question: "Dado \\(|\\phi\\rangle = \\alpha_0|0\\rangle + \\alpha_1|1\\rangle\\) y \\(|\\chi\\rangle = \\beta_0|0\\rangle + \\beta_1|1\\rangle\\), ¿cuál es la amplitud del estado base \\(|01\\rangle\\) en el estado producto \\(|\\phi\\rangle \\otimes |\\chi\\rangle\\)?",
                options: ["\\(\\alpha_0\\beta_1\\)", "\\(\\alpha_1\\beta_0\\)", "\\(\\alpha_0+\\beta_1\\)", "\\(\\alpha_1+\\beta_0\\)"],
                correctAnswer: 0,
                feedback: [
                    "¡Correcto! La amplitud del estado base \\(|u_i v_j\\rangle\\) es el producto de las amplitudes individuales \\(\\alpha_i \\beta_j\\). Para \\(|01\\rangle\\), esto corresponde a \\(\\alpha_0 \\beta_1\\).",
                    "Incorrecto. Esto correspondería a la amplitud del estado base \\(|10\\rangle\\).",
                    "Incorrecto. Las amplitudes se multiplican, no se suman.",
                    "Incorrecto. Las amplitudes se multiplican, no se suman."
                ],
                hint: "La amplitud de un estado base compuesto es el producto de las amplitudes originales correspondientes.",
                theoryHTML: `<h2>Expansión de un Estado Producto</h2>
                    <p>Si \\(|\\phi\\rangle = \\sum_i \\alpha_i|u_i\\rangle\\) y \\(|\\chi\\rangle = \\sum_j \\beta_j|v_j\\rangle\\), entonces su producto tensorial es:</p>
                    <p style="text-align:center;">\\( |\\psi\\rangle = \\sum_{i,j} \\alpha_i \\beta_j (|u_i\\rangle \\otimes |v_j\\rangle) \\)</p>
                    <p>La amplitud del estado base \\(|u_i v_j\\rangle\\) en el estado compuesto es el producto de las amplitudes originales, \\(\\alpha_i \\beta_j\\).</p>`
            },
            {
                question: "Usando el Producto de Kronecker, calcula \\(|0\\rangle \\otimes |1\\rangle\\), donde \\(|0\\rangle = \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix}\\) y \\(|1\\rangle = \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix}\\).",
                options: [
                    "\\(\\begin{pmatrix} 1 \\\\ 0 \\\\ 0 \\\\ 0 \\end{pmatrix}\\)",
                    "\\(\\begin{pmatrix} 0 \\\\ 1 \\\\ 0 \\\\ 0 \\end{pmatrix}\\)",
                    "\\(\\begin{pmatrix} 0 \\\\ 0 \\\\ 1 \\\\ 0 \\end{pmatrix}\\)",
                    "\\(\\begin{pmatrix} 0 \\\\ 0 \\\\ 0 \\\\ 1 \\end{pmatrix}\\)"
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Este es el vector para \\(|00\\rangle\\).",
                    "¡Correcto! Se calcula como \\(\\begin{pmatrix} 1 \\cdot \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix} \\\\ 0 \\cdot \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix} \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ 1 \\\\ 0 \\\\ 0 \\end{pmatrix}\\).",
                    "Incorrecto. Este es el vector para \\(|10\\rangle\\).",
                    "Incorrecto. Este es el vector para \\(|11\\rangle\\)."
                ],
                hint: "Reemplaza cada elemento del primer vector por ese elemento multiplicado por el segundo vector completo.",
                theoryHTML: `<h2>El Producto de Kronecker</h2>
                    <p>Si \\(|\\psi\\rangle = \\begin{pmatrix} \\alpha_1 \\\\ \\vdots \\end{pmatrix}\\) y \\(|\\phi\\rangle = \\begin{pmatrix} \\beta_1 \\\\ \\vdots \\end{pmatrix}\\), entonces:</p>
                    <p style="text-align:center;">\\( |\\psi\\rangle \\otimes |\\phi\\rangle = \\begin{pmatrix} \\alpha_1 |\\phi\\rangle \\\\ \\alpha_2 |\\phi\\rangle \\\\ \\vdots \\end{pmatrix} \\)</p>
                    <p><b>Ejemplo:</b> \\(|01\\rangle = |0\\rangle \\otimes |1\\rangle = \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix} \\otimes \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix} = \\begin{pmatrix} 1 \\cdot \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix} \\\\ 0 \\cdot \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix} \\end{pmatrix} = \\begin{pmatrix} 0 \\\\ 1 \\\\ 0 \\\\ 0 \\end{pmatrix}\\)</p>`
            },
            {
                question: "¿Cuál de las siguientes afirmaciones sobre el producto tensorial de vectores es correcta?",
                options: ["Es conmutativo: \\(|v\\rangle \\otimes |w\\rangle = |w\\rangle \\otimes |v\\rangle\\).", "No es conmutativo: \\(|v\\rangle \\otimes |w\\rangle \\neq |w\\rangle \\otimes |v\\rangle\\).", "Es anticonmutativo: \\(|v\\rangle \\otimes |w\\rangle = -|w\\rangle \\otimes |v\\rangle\\).", "El orden es irrelevante."],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. El orden de los elementos en el vector columna resultante cambia si se invierte el orden de la operación.",
                    "¡Correcto! El cálculo práctico mediante el Producto de Kronecker demuestra que el orden de los vectores importa y el resultado no es el mismo. El orden de los qubits en un registro es fundamental.",
                    "Incorrecto. No hay un cambio de signo general.",
                    "Incorrecto. El orden es crucial para la representación del vector y la aplicación de operadores."
                ],
                hint: "Calcula \\(|0\\rangle \\otimes |1\\rangle\\) y \\(|1\\rangle \\otimes |0\\rangle\\) y compara los vectores resultantes.",
                theoryHTML: `<h2>El Producto Tensorial es NO Conmutativo</h2>
                    <p>\\( |\\phi\\rangle \\otimes |\\chi\\rangle = \\begin{pmatrix} \\alpha\\gamma \\\\ \\alpha\\delta \\\\ \\beta\\gamma \\\\ \\beta\\delta \\end{pmatrix} \\quad \\neq \\quad |\\chi\\rangle \\otimes |\\phi\\rangle = \\begin{pmatrix} \\gamma\\alpha \\\\ \\gamma\\beta \\\\ \\delta\\alpha \\\\ \\delta\\beta \\end{pmatrix} \\)</p>
                    <p><b>Nota:</b> Para todos los propósitos prácticos de cálculo y programación, <b>el orden es fundamental y la operación no es conmutativa.</b></p>`
            },
            {
                question: "Si \\(|\\psi_1\\rangle = |\\phi_1\\rangle \\otimes |\\chi_1\\rangle\\) y \\(|\\psi_2\\rangle = |\\phi_2\\rangle \\otimes |\\chi_2\\rangle\\), ¿cuál es la regla para calcular el producto interno \\(\\langle\\psi_1|\\psi_2\\rangle\\)?",
                options: ["\\(\\langle\\phi_1|\\phi_2\\rangle + \\langle\\chi_1|\\chi_2\\rangle\\)", "\\(\\langle\\phi_1|\\phi_2\\rangle \\cdot \\langle\\chi_1|\\chi_2\\rangle\\)", "\\(\\langle\\phi_1|\\chi_1\\rangle \\cdot \\langle\\phi_2|\\chi_2\\rangle\\)", "\\(\\langle\\phi_1|\\chi_2\\rangle \\otimes \\langle\\chi_1|\\phi_2\\rangle\\)"],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Los productos internos individuales se multiplican, no se suman.",
                    "¡Correcto! El producto interno de dos estados producto se calcula multiplicando los productos internos de sus componentes individuales.",
                    "Incorrecto. Se deben agrupar los componentes del primer espacio y los del segundo espacio.",
                    "Incorrecto. El resultado final debe ser un escalar, no un producto tensorial."
                ],
                hint: "El producto interno de un estado tensorial se descompone en operaciones más simples.",
                theoryHTML: `<h2>Productos Internos en Espacios Compuestos</h2>
                    <p><b>La Regla:</b> El producto interno de dos estados producto se calcula multiplicando los productos internos de sus componentes individuales.</p>
                    <p>Si \\(|\\psi_1\\rangle = |\\phi_1\\rangle \\otimes |\\chi_1\\rangle\\) y \\(|\\psi_2\\rangle = |\\phi_2\\rangle \\otimes |\\chi_2\\rangle\\), entonces:</p>
                    <p style="text-align:center;">\\( \\langle\\psi_1|\\psi_2\\rangle = \\langle\\phi_1|\\phi_2\\rangle \\cdot \\langle\\chi_1|\\chi_2\\rangle \\)</p>`
            },
            {
                question: "Para un estado compuesto \\(|\\psi\\rangle = |\\phi\\rangle \\otimes |\\chi\\rangle\\), ¿cuál es su bra correspondiente, \\(\\langle\\psi|\\)?",
                options: ["\\(\\langle\\phi| \\otimes \\langle\\chi|\\)", "\\(\\langle\\chi| \\otimes \\langle\\phi|\\)", "\\(\\langle\\phi| + \\langle\\chi|\\)", "\\((\\langle\\phi|\\langle\\chi|)\\)"],
                correctAnswer: 0,
                feedback: [
                    "¡Correcto! La operación daga se distribuye sobre el producto tensorial, convirtiendo cada ket en su bra correspondiente: \\((|\\phi\\rangle \\otimes |\\chi\\rangle)^\\dagger = |\\phi\\rangle^\\dagger \\otimes |\\chi\\rangle^\\dagger = \\langle\\phi| \\otimes \\langle\\chi|\\).",
                    "Incorrecto. El orden no se invierte para la daga de un producto tensorial.",
                    "Incorrecto. La operación no se convierte en una suma.",
                    "Incorrecto. Esto es una notación ambigua."
                ],
                hint: "La operación daga (\\(\\dagger\\)) se distribuye sobre el producto tensorial (\\(\\otimes\\)).",
                theoryHTML: `<h2>El Adjunto (\\(\\dagger\\)) de un Producto Tensorial</h2>
                    <p>La daga de un producto tensorial es el producto tensorial de las dagas.</p>
                    <p style="text-align:center;">\\( (A \\otimes B)^\\dagger = A^\\dagger \\otimes B^\\dagger \\)</p>
                    <p><b>Aplicación a Kets:</b> Como la daga de un ket es un bra, esto nos da la regla para construir el bra de un estado compuesto:</p>
                    <p style="text-align:center;">\\( (|\\phi\\rangle \\otimes |\\chi\\rangle)^\\dagger = |\\phi\\rangle^\\dagger \\otimes |\\chi\\rangle^\\dagger = \\langle\\phi| \\otimes \\langle\\chi| \\)</p>`
            },
            {
                question: "¿Cuál es la regla para el producto de dos operadores tensoriales \\((A \\otimes B)(C \\otimes D)\\)?",
                options: ["\\((AC) \\otimes (BD)\\)", "\\((AD) \\otimes (BC)\\)", "\\((A+C) \\otimes (B+D)\\)", "\\((AB) \\otimes (CD)\\)"],
                correctAnswer: 0,
                feedback: [
                    "¡Correcto! Los operadores que actúan sobre el primer espacio (A, C) se agrupan, y los que actúan sobre el segundo espacio (B, D) se agrupan.",
                    "Incorrecto. Los operadores no se cruzan entre espacios.",
                    "Incorrecto. La operación es un producto, no una suma.",
                    "Incorrecto. Revisa el orden de las matrices en el producto."
                ],
                hint: "Los operadores que actúan en el mismo subespacio se agrupan.",
                theoryHTML: `<h2>Multiplicación de Productos Tensoriales</h2>
                    <p>El producto de dos operadores tensoriales es el producto tensorial de los productos de sus componentes individuales.</p>
                    <p style="text-align:center;">\\( (A \\otimes B)(C \\otimes D) = (AC) \\otimes (BD) \\)</p>
                    <p><b>La Intuición:</b> Los operadores que actúan sobre el primer espacio (A, C) se agrupan, y los que actúan sobre el segundo espacio (B, D) se agrupan.</p>`
            },
            {
                question: "En un estado de 2 qubits \\(|\\Psi\\rangle = c_{00}|00\\rangle + c_{01}|01\\rangle + c_{10}|10\\rangle + c_{11}|11\\rangle\\), ¿cómo se calcula la probabilidad de medir el estado \\(|10\\rangle\\)?",
                options: ["\\(|c_{10}|^2\\)", "\\(c_{10}\\)", "\\(|c_{01}|^2\\)", "\\(c_{10}^*\\)"],
                correctAnswer: 0,
                feedback: [
                    "¡Correcto! La Regla de Born se generaliza directamente. La probabilidad de medir un estado base es el módulo al cuadrado de su amplitud correspondiente.",
                    "Incorrecto. Esto es la amplitud, que es un número complejo. La probabilidad debe ser un número real.",
                    "Incorrecto. Esta sería la probabilidad de medir el estado \\(|01\\rangle\\).",
                    "Incorrecto. Este es el conjugado de la amplitud."
                ],
                hint: "La Regla de Born es la misma que para un solo qubit, pero aplicada a las amplitudes del estado compuesto.",
                theoryHTML: `<h2>Amplitudes y Probabilidad en Sistemas Compuestos</h2>
                    <p>La amplitud \\(c_{ab}\\) del estado base \\(|ab\\rangle\\) en un estado compuesto general \\(|\\Psi\\rangle\\) se calcula con el producto interno: \\( c_{ab} = \\langle ab | \\Psi \\rangle \\)</p>
                    <p>La probabilidad de medir \\(|ab\\rangle\\) sigue siendo la Regla de Born:</p>
                    <p style="text-align:center;">\\( P(ab) = |\\langle ab | \\Psi \\rangle|^2 = |c_{ab}|^2 \\)</p>`

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        const questionCounterEl = document.getElementById('question-counter');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackPanelEl = document.getElementById('feedback-panel');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContentEl = document.getElementById('quiz-content');
        const scoreContainerEl = document.getElementById('score-container');
        const scoreTextEl = document.getElementById('score-text');
        const hintSectionEl = document.getElementById('hint-section');
        const modalEl = document.getElementById('theory-modal');
        const modalTextEl = document.getElementById('modal-text');


        function displayQuestion() {
            feedbackPanelEl.style.display = 'none';
            optionsContainerEl.innerHTML = '';
            hintSectionEl.innerHTML = '';

            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];

            questionCounterEl.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            questionTextEl.innerHTML = currentQuestion.question;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = option;
                button.className = 'option-btn';
                button.onclick = () => checkAnswer(index);
                optionsContainerEl.appendChild(button);
            });

            // Add Hint functionality
            const hintBtn = document.createElement('button');
            hintBtn.textContent = 'Necesito una pista';
            hintBtn.className = 'hint-btn';
            const hintText = document.createElement('div');
            hintText.id = 'hint-text';
            hintText.innerHTML = currentQuestion.hint;
            hintBtn.onclick = () => {
                hintText.style.display = 'block';
                hintBtn.style.display = 'none';
            };
            hintSectionEl.appendChild(hintBtn);
            hintSectionEl.appendChild(hintText);

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }

            updateNavButtons();

            if(userAnswers[currentQuestionIndex] !== null){
                showPreviousAnswer();
            }
        }

        function showPreviousAnswer(){
            const userAnswer = userAnswers[currentQuestionIndex];
            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer;
            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            const hintBtn = hintSectionEl.querySelector('.hint-btn');
            if(hintBtn) hintBtn.style.display = 'none';


            optionButtons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === userAnswer.selectedIndex) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            feedbackPanelEl.innerHTML = `<p>${currentQuestion.feedback[userAnswer.selectedIndex]}</p>`;

            const theoryBtn = document.createElement('button');
            theoryBtn.textContent = 'Ver Teoría';
            theoryBtn.className = 'theory-btn';
            theoryBtn.onclick = () => showTheory(currentQuestion.theoryHTML);
            feedbackPanelEl.appendChild(theoryBtn);

            feedbackPanelEl.className = userAnswer.isCorrect ? 'correct-feedback' : 'incorrect-feedback';
            feedbackPanelEl.style.display = 'block';

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex) {
            if(userAnswers[currentQuestionIndex] !== null) return;

            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correctAnswer;

            userAnswers[currentQuestionIndex] = { selectedIndex, isCorrect };

            if(isCorrect) {
                score++;
            }

            showPreviousAnswer();
        }

        function showTheory(htmlContent) {
            modalTextEl.innerHTML = htmlContent;
            modalEl.style.display = 'flex';
            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset([modalTextEl]);
            }
        }

        function closeModal() {
            modalEl.style.display = 'none';
        }

        function updateNavButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length -1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                 nextBtn.textContent = 'Siguiente';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function showScore(){
            quizContentEl.style.display = 'none';
            document.querySelector('.navigation-controls').style.display = 'none';
            scoreContainerEl.style.display = 'block';

            scoreTextEl.textContent = `Tu puntuación es ${score} de ${quizData.length}.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;

            scoreContainerEl.style.display = 'none';
            quizContentEl.style.display = 'block';
            document.querySelector('.navigation-controls').style.display = 'flex';

            displayQuestion();
        }

        // Iniciar el cuestionario
        displayQuestion();
    </script>
