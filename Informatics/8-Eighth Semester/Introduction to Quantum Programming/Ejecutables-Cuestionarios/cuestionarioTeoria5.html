    <script>
        const quizData = [
            {
                question: "Según el postulado de la medición, los únicos resultados posibles de medir un observable \\(\\hat{A}\\) son:",
                options: [ "Sus autovectores.", "Sus autovalores.", "Su traza.", "Los elementos de su diagonal." ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Los autovectores son los estados en los que colapsa el sistema, no los resultados numéricos de la medición.",
                    "¡Correcto! Este es un pilar de la mecánica cuántica. Los posibles valores clásicos que podemos obtener de una medición están determinados por los autovalores del operador Hermitiano que representa a dicha medición.",
                    "Incorrecto. La traza es la suma de los autovalores, que corresponde al valor esperado si el estado es una mezcla equitativa, pero no es el resultado de una única medición.",
                    "Incorrecto. Los elementos de la diagonal solo coinciden con los autovalores si la matriz ya está diagonalizada."
                ],
                hint: "Recuerda la diferencia entre el estado en el que queda el sistema y el valor numérico que se obtiene.",
                theoryHTML: `<h2>El Postulado de la Medición</h2>
                    <p>Este es uno de los postulados fundamentales de la mecánica cuántica, que conecta el álgebra con el experimento.</p>
                    <ol>
                        <li>Toda cantidad físicamente medible (un <b>observable</b>, como el espín) se representa por un <b>operador</b>.</li>
                        <li>Los únicos resultados posibles de la medición de ese observable son los <b>autovalores</b> de dicho operador.</li>
                        <li>Inmediatamente después de la medición, el estado del sistema <b>colapsa</b> al <b>autovector</b> correspondiente al autovalor que se obtuvo.</li>
                    </ol>`
            },
            {
                question: "Un vector \\(|\\psi\\rangle\\) es un autovector de un operador \\(\\hat{A}\\) si al aplicar el operador, el vector:",
                options: [ "Se convierte en el vector nulo.", "Rota 90 grados.", "No cambia su dirección, solo es re-escalado.", "Se invierte." ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. Esto solo ocurre si el autovalor es 0 y el operador no es invertible.",
                    "Incorrecto. Una rotación generalmente cambia la dirección del vector.",
                    "¡Correcto! Esta es la definición conceptual. La ecuación \\(\\hat{A}|\\psi\\rangle = \\lambda|\\psi\\rangle\\) significa que el vector resultante \\(\\hat{A}|\\psi\\rangle\\) es paralelo al vector original \\(|\\psi\\rangle\\), y \\(\\lambda\\) es el factor de escala.",
                    "Incorrecto. La inversión es un caso particular donde el factor de escala (autovalor) es -1."
                ],
                hint: "Piensa en la definición matemática: \\(\\hat{A}|\\psi\\rangle = \\lambda|\\psi\\rangle\\). ¿Qué le pasa al vector \\(|\\psi\\rangle\\)?",
                theoryHTML: `<h2>Autovectores y Autovalores</h2>
                    <p>Para casi todo operador, existen ciertos <b>vectores especiales</b> que la transformación los afecta de una manera especial. Al aplicar el operador, estos vectores <b>no cambian su dirección</b>. Lo único que les ocurre es que son re-escalados (estirados o encogidos).</p>
                    <ul>
                        <li>Estos vectores se llaman <b>autovectores</b>.</li>
                        <li>El factor por el cual son re-escalados se llama <b>autovalor</b>.</li>
                    </ul>
                    <h3>Definición Formal</h3>
                    <p>Un vector no nulo \\(|\\psi\\rangle\\) es un <b>autovector</b> de un operador \\(\\hat{A}\\) si existe un escalar \\(\\lambda\\) tal que:</p>
                    <p style="text-align:center;">\\( \\hat{A}|\\psi\\rangle = \\lambda|\\psi\\rangle \\)</p>`
            },
            {
                question: "Para que una cantidad física sea un observable (medible), debe ser representada por un operador Hermitiano. Esto es crucial porque los operadores Hermitianos garantizan que:",
                options: [ "Sus autovalores son complejos y sus autovectores son ortogonales.", "Sus autovalores son reales y sus autovectores son colineales.", "Sus autovalores son reales y sus autovectores (para autovalores distintos) son ortogonales.", "Son siempre operadores unitarios." ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. Los resultados de una medición deben ser reales, no complejos.",
                    "Incorrecto. Sus autovectores forman una base, por lo que deben ser ortogonales, no colineales.",
                    "¡Correcto! Estas dos propiedades son fundamentales. Los autovalores reales aseguran que los resultados de la medición sean números reales, y los autovectores ortogonales forman una base completa de estados perfectamente distinguibles (Teorema Espectral).",
                    "Incorrecto. Un operador puede ser Hermitiano sin ser Unitario (y viceversa). Por ejemplo, los proyectores son Hermitianos pero no unitarios."
                ],
                hint: "Los resultados de laboratorio son números reales, y los estados de respuesta definitiva deben ser distinguibles entre sí.",
                theoryHTML: `<h2>Operadores Hermitianos (o Hermíticos)</h2>
                    <p>En un laboratorio, los resultados de las mediciones son siempre <b>números reales</b>. Por lo tanto, necesitamos una clase de operadores que garanticen que sus autovalores sean siempre números reales.</p>
                    <p>Un operador \\(\\hat{A}\\) es <b>Hermitiano</b> si es igual a su adjunto hermitiano: \\( \\hat{A} = \\hat{A}^\\dagger \\).</p>
                    <p>Esta condición garantiza dos propiedades fundamentales:</p>
                    <ol>
                        <li><b>Sus autovalores son siempre REALES.</b></li>
                        <li><b>Sus autovectores correspondientes a autovalores DIFERENTES son siempre ORTOGONALES.</b></li>
                    </ol>
                    <p>Por esto, los <b>observables</b> físicos se representan por <b>operadores Hermitianos</b>.</p>`
            },
            {
                question: "¿Cuál es la ecuación característica que se debe resolver para encontrar los autovalores \\(\\lambda\\) de una matriz A?",
                options: [ "\\( \\det(A + \\lambda I) = 0 \\)", "\\( A - \\lambda I = 0 \\)", "\\( \\text{Tr}(A - \\lambda I) = 0 \\)", "\\( \\det(A - \\lambda I) = 0 \\)" ],
                correctAnswer: 3,
                feedback: [
                    "Incorrecto. El signo es incorrecto.",
                    "Incorrecto. Esta es una ecuación matricial, y buscamos una ecuación escalar para \\(\\lambda\\).",
                    "Incorrecto. Se debe usar el determinante, no la traza.",
                    "¡Correcto! Esta ecuación surge de la condición de que la matriz \\((A - \\lambda I)\\) debe transformar un vector no nulo al vector nulo, lo que implica que no es invertible y su determinante debe ser cero."
                ],
                hint: "La solución requiere que una matriz no sea invertible. ¿Qué propiedad matemática de una matriz se relaciona con su invertibilidad?",
                theoryHTML: `<h2>La Ecuación Característica</h2>
                    <p>Para encontrar los autovalores, debemos resolver la ecuación \\( \\hat{A}|\\psi\\rangle = \\lambda|\\psi\\rangle \\). La reescribimos como:</p>
                    <p style="text-align:center;">\\( (\\hat{A} - \\lambda\\hat{I})|\\psi\\rangle = \\vec{0} \\)</p>
                    <p>Esta ecuación nos dice que la matriz \\((A-\\lambda I)\\) transforma el vector <b>no nulo</b> \\(|\\psi\\rangle\\) en el vector cero. Esto solo puede ocurrir si la matriz \\((A-\\lambda I)\\) <b>no es invertible</b>, es decir, su <b>determinante debe ser cero</b>.</p>
                    <p>Por lo tanto, la ecuación a resolver es:</p>
                    <p style="text-align:center;">\\( \\det(A - \\lambda I) = 0 \\)</p>`
            },
            {
                question: "El Teorema Espectral es fundamental para la medición porque garantiza que:",
                options: [ "Todo operador tiene autovalores reales.", "Los autovectores de cualquier operador Hermitiano forman una base ortonormal completa.", "Toda medición es un proceso reversible.", "La suma de las probabilidades siempre es 1." ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Esto es una propiedad de los operadores Hermitianos, pero el Teorema Espectral va más allá.",
                    "¡Correcto! Esto asegura que no hay 'puntos ciegos'. Cualquier estado cuántico se puede expresar como una superposición de los estados de respuesta de cualquier medición posible, haciendo la teoría consistente y predictiva.",
                    "Incorrecto. La medición es un proceso irreversible.",
                    "Incorrecto. La consistencia de las probabilidades es una consecuencia del Teorema Espectral, pero no es el teorema en sí."
                ],
                hint: "Este teorema asegura que no existen 'puntos ciegos' en el espacio de estados para ninguna medición.",
                theoryHTML: `<h2>El Teorema Espectral</h2>
                    <p>Para cualquier operador Hermitiano \\(\\hat{A}\\) que actúa sobre un espacio de N dimensiones, está garantizado que se pueden encontrar <b>N autovectores</b> que forman una <b>base ortonormal</b> para todo el espacio.</p>
                    <p><b>¿Por qué es fundamental?</b><br>
                    Garantiza que los "estados de respuesta" de cualquier observable (sus autovectores) forman una base completa. Esto asegura que la teoría de la medición cuántica sea lógicamente consistente. Si no formaran una base, existirían estados "ciegos" para los cuales la suma de probabilidades de medición no sería 1, lo cual sería una contradicción.</p>`
            },
            {
                question: "Los autovalores del observable Pauli-Z son \\( \\lambda = +1, -1 \\). El autovector correspondiente al autovalor -1 es:",
                options: [ "\\( |+\\rangle \\)", "\\( |0\\rangle \\)", "\\( |-\\rangle \\)", "\\( |1\\rangle \\)" ],
                correctAnswer: 3,
                feedback: [
                    "Incorrecto. Este es un autovector del observable Pauli-X.",
                    "Incorrecto. \\(|0\\rangle\\) es el autovector de Z con autovalor +1.",
                    "Incorrecto. Este es un autovector del observable Pauli-X.",
                    "¡Correcto! Al aplicar Z a \\(|1\\rangle\\), obtenemos \\(\\hat{Z}|1\\rangle = -|1\\rangle = (-1) \\cdot |1\\rangle\\). Por lo tanto, \\(|1\\rangle\\) es el autovector con autovalor -1."
                ],
                hint: "Recuerda la acción de la compuerta Z sobre los estados de la base computacional: \\(\\hat{Z}|0\\rangle = |0\\rangle\\) y \\(\\hat{Z}|1\\rangle = -|1\\rangle\\).",
                theoryHTML: `<h2>Autovectores del Observable Z</h2>
                    <p>Para el operador Pauli-Z, \\(Z = \\begin{pmatrix} 1 & 0 \\\\ 0 & -1 \\end{pmatrix}\\), los autovalores y autovectores son:</p>
                    <ul>
                        <li><b>Autovalor \\(\\lambda_1 = +1\\):</b><br>
                        Resolviendo \\(Z|\\psi\\rangle = 1 \\cdot |\\psi\\rangle\\), encontramos que el autovector es \\( |0\\rangle = \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix} \\).</li>
                        <li><b>Autovalor \\(\\lambda_2 = -1\\):</b><br>
                        Resolviendo \\(Z|\\psi\\rangle = -1 \\cdot |\\psi\\rangle\\), encontramos que el autovector es \\( |1\\rangle = \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix} \\).</li>
                    </ul>`
            },
            {
                question: "Si medimos un qubit en el estado \\(|+\\rangle\\) usando el observable Pauli-X, ¿cuál será el resultado?",
                options: [ "Siempre +1.", "Siempre -1.", "50% de probabilidad de obtener +1 y 50% de -1.", "El resultado es indefinido." ],
                correctAnswer: 0,
                feedback: [
                    "¡Correcto! El estado \\(|+\\rangle\\) es un autovector del observable X con autovalor +1. Los autovectores son 'estados de respuesta definitiva'. Si el sistema ya está en un autovector, la medición de ese observable siempre dará el autovalor correspondiente con 100% de certeza.",
                    "Incorrecto. El autovalor correspondiente a \\(|+\\rangle\\) es +1.",
                    "Incorrecto. La aleatoriedad ocurre cuando el estado medido es una superposición de los autovectores del observable.",
                    "Incorrecto. El resultado es completamente predecible en este caso."
                ],
                hint: "El sistema ya está en uno de los 'estados de respuesta definitiva' para la pregunta que se le está haciendo.",
                theoryHTML: `<h2>Medición y Estados Estables</h2>
                    <p>Los únicos estados que son <b>"estables"</b> bajo una medición son aquellos que no son alterados por el operador de esa medición (salvo por un factor numérico). Es decir, sus autovectores.</p>
                    <p>El estado \\(|+\\rangle\\) es un autovector del observable X, con autovalor +1:</p>
                    <p style="text-align:center;">\\( \\hat{X}|+\\rangle = \\hat{X} \\left(\\frac{1}{\\sqrt{2}}(|0\\rangle+|1\\rangle)\\right) = \\frac{1}{\\sqrt{2}}(|1\\rangle+|0\\rangle) = (+1) \\cdot |+\\rangle \\)</p>
                    <p>Si el sistema ya se encuentra en un autovector de un observable, el resultado de la medición de ese observable es 100% seguro: será el autovalor correspondiente.</p>`
            },
            {
                question: "El valor esperado de un observable \\(\\hat{A}\\) en un estado \\(|\\psi\\rangle\\), denotado \\(\\langle \\hat{A} \\rangle\\), se calcula como:",
                options: [ "\\( \\langle \\psi | \\psi \\rangle \\)", "\\( |\\langle \\psi | \\hat{A} | \\psi \\rangle|^2 \\)", "\\( \\langle \\psi | \\hat{A} | \\psi \\rangle \\)", "\\( \\text{Tr}(\\hat{A}) \\)" ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. Esto calcula la norma al cuadrado del estado, que es 1.",
                    "Incorrecto. El valor esperado no es una probabilidad, por lo que no se eleva al cuadrado.",
                    "¡Correcto! Esta fórmula 'sándwich' representa el promedio ponderado de los autovalores del observable, donde cada autovalor se pondera por la probabilidad de obtenerlo.",
                    "Incorrecto. La traza es la suma de los autovalores, no su promedio ponderado por probabilidades."
                ],
                hint: "La fórmula tiene una estructura de 'sándwich' con el operador en el medio.",
                theoryHTML: `<h2>El Valor Esperado (Expectation Value)</h2>
                    <p>Si un qubit está en una superposición, cada medición puede dar un resultado diferente. El <b>promedio</b> de los resultados si repitiéramos el experimento muchas veces se llama el <b>valor esperado</b>.</p>
                    <p>Se denota \\(\\langle \\hat{A} \\rangle\\) y se calcula con la fórmula:</p>
                    <p style="text-align:center;">\\( \\langle \\hat{A} \\rangle = \\langle \\psi | \\hat{A} | \\psi \\rangle \\)</p>
                    <p>El valor esperado es un <b>promedio ponderado</b> de los autovalores del operador, donde cada autovalor se pondera por la probabilidad de obtener ese resultado: \\( \\langle \\hat{A} \\rangle = \\sum_i \\lambda_i \\cdot P(\\lambda_i) \\).</p>`
            },
            {
                question: "Un operador de proyección \\( \\hat{P}_\\phi = |\\phi\\rangle\\langle\\phi| \\) es un operador que:",
                options: [ "Es siempre unitario.", "Es Hermitiano e Idempotente (\\(\\hat{P}^2 = \\hat{P}\\)).", "Tiene autovalores complejos.", "No es lineal." ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Un proyector (excepto la Identidad) no es unitario porque la proyección es un proceso irreversible que pierde información.",
                    "¡Correcto! Un proyector es Hermitiano (\\(\\hat{P}^\\dagger = \\hat{P}\\)) y aplicarlo dos veces es lo mismo que aplicarlo una vez (Idempotente). Estas dos propiedades lo definen.",
                    "Incorrecto. Al ser Hermitiano, sus autovalores son reales (de hecho, son 0 y 1).",
                    "Incorrecto. Se puede demostrar que los proyectores son operadores lineales."
                ],
                hint: "Piensa en las dos propiedades que definen a un proyector, una relacionada con su adjunto y otra con aplicarlo dos veces.",
                theoryHTML: `<h2>Operadores de Proyección</h2>
                    <p>Un proyector se define como \\( \\hat{P}_\\phi = |\\phi\\rangle\\langle\\phi| \\). Tiene dos propiedades clave:</p>
                    <ol>
                        <li><b>Es Hermitiano:</b> \\( \\hat{P}_\\phi^\\dagger = ( |\\phi\\rangle\\langle\\phi| )^\\dagger = (\\langle\\phi|)^\\dagger ( |\\phi\\rangle)^\\dagger = |\\phi\\rangle\\langle\\phi| = \\hat{P}_\\phi \\).</li>
                        <li><b>Es Idempotente:</b> Aplicarlo dos veces es igual que aplicarlo una vez. \\( \\hat{P}_\\phi^2 = ( |\\phi\\rangle\\langle\\phi| ) ( |\\phi\\rangle\\langle\\phi| ) = |\\phi\\rangle (\\langle\\phi|\\phi\\rangle) \\langle\\phi| = |\\phi\\rangle (1) \\langle\\phi| = \\hat{P}_\\phi \\).</li>
                    </ol>`

        function displayQuestion() {
            feedbackPanelEl.style.display = 'none';
            optionsContainerEl.innerHTML = '';
            hintSectionEl.innerHTML = '';

            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];

            questionCounterEl.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            questionTextEl.innerHTML = currentQuestion.question;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = option;
                button.className = 'option-btn';
                button.onclick = () => checkAnswer(index);
                optionsContainerEl.appendChild(button);
            });

            // Add Hint functionality
            const hintBtn = document.createElement('button');
            hintBtn.textContent = 'Necesito una pista';
            hintBtn.className = 'hint-btn';
            const hintText = document.createElement('div');
            hintText.id = 'hint-text';
            hintText.innerHTML = currentQuestion.hint;
            hintBtn.onclick = () => {
                hintText.style.display = 'block';
                hintBtn.style.display = 'none';
            };
            hintSectionEl.appendChild(hintBtn);
            hintSectionEl.appendChild(hintText);

                 MathJax.typeset();
            }

            updateNavButtons();

            if(userAnswers[currentQuestionIndex] !== null){
                showPreviousAnswer();
            }
        }

        function showPreviousAnswer(){
            const userAnswer = userAnswers[currentQuestionIndex];
            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer;
            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            const hintBtn = hintSectionEl.querySelector('.hint-btn');
            if(hintBtn) hintBtn.style.display = 'none';


            optionButtons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === userAnswer.selectedIndex) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            feedbackPanelEl.innerHTML = `<p>${currentQuestion.feedback[userAnswer.selectedIndex]}</p>`;

            const theoryBtn = document.createElement('button');
            theoryBtn.textContent = 'Ver Teoría';
            theoryBtn.className = 'theory-btn';
            theoryBtn.onclick = () => showTheory(currentQuestion.theoryHTML);
            feedbackPanelEl.appendChild(theoryBtn);

            feedbackPanelEl.className = userAnswer.isCorrect ? 'correct-feedback' : 'incorrect-feedback';
            feedbackPanelEl.style.display = 'block';

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex) {
            if(userAnswers[currentQuestionIndex] !== null) return;

            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correctAnswer;

            userAnswers[currentQuestionIndex] = { selectedIndex, isCorrect };

            if(isCorrect) {
                score++;
            }

            showPreviousAnswer();
        }

        function updateNavButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length -1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                 nextBtn.textContent = 'Siguiente';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function showScore(){
            quizContentEl.style.display = 'none';
            document.querySelector('.navigation-controls').style.display = 'none';
            scoreContainerEl.style.display = 'block';

            scoreTextEl.textContent = `Tu puntuación es ${score} de ${quizData.length}.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;

            scoreContainerEl.style.display = 'none';
            quizContentEl.style.display = 'block';
            document.querySelector('.navigation-controls').style.display = 'flex';

            displayQuestion();
        }

        // Iniciar el cuestionario
        displayQuestion();
    </script>

</body>
</html>
