    <script>
        const quizData = [
            // --- TEMA 1: TEOREMA DE NO CLONACIÓN ---
            {

                   `
            },
            {

                    "No, porque el estado resultante está entrelazado."
                ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. Solo parece copiar en la base clásica (0 y 1).",
                    "Incorrecto.",
                    "¡Correcto! La CNOT copia información clásica (base Z), pero falla al intentar copiar estados en superposición (como \\(|+\\rangle\\)), creando entrelazamiento en su lugar.",
                    "Incorrecto. Para las entradas \\(|00\\rangle\\) y \\(|10\\rangle\\), el resultado NO está entrelazado."
                ],
                hint: "Para ser un clonador universal, debería funcionar también para el estado \\(|+\\rangle\\).",

                   `
            },
            {
                question: "Si intentamos clonar el estado \\(|+\\rangle\\) usando una CNOT (con un objetivo en \\(|0\\rangle\\)), ¿qué estado obtenemos realmente?",
                options: [
                    "Dos copias separadas: \\(|+\\rangle|+\\rangle\\).",
                    "El estado de Bell \\(|\\Phi^+\\rangle = \\frac{|00\\rangle+|11\\rangle}{\\sqrt{2}}\\).",
                    "El estado \\(|00\\rangle\\).",
                    "El estado \\(|11\\rangle\\)."
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Este sería el resultado de un clonador ideal, pero es imposible.",
                    "¡Correcto! \\( CNOT(|+\\rangle|0\\rangle) = CNOT(\\frac{|00\\rangle+|10\\rangle}{\\sqrt{2}}) = \\frac{|00\\rangle+|11\\rangle}{\\sqrt{2}} \\). Es un estado entrelazado.",
                    "Incorrecto.",
                    "Incorrecto."

                hint: "Aplica la linealidad: la CNOT actúa sobre \\(|00\\rangle\\) y \\(|10\\rangle\\) por separado.",

                    <p>El resultado es un estado <b>entrelazado</b>, no dos copias independientes. <b>La CNOT no clona, entrelaza.</b></p>
                   `
            },
            {
                question: "La demostración del teorema de no-clonación por contradicción concluye que una máquina clonadora universal solo podría clonar dos estados \\(|\\psi\\rangle\\) y \\(|\\phi\\rangle\\) si:",
                options: [
                    "Son ortogonales (\\(\\langle\\psi|\\phi\\rangle = 0\\)) o idénticos.",
                    "Están en superposición.",

                correctAnswer: 0,

                    "Incorrecto.",
                    "Incorrecto.",
                    "Incorrecto."
                ],
                hint: "La condición matemática es \\(x = x^2\\). ¿Qué valores puede tomar x?",
                theoryHTML: `<h2>La Contradicción Matemática</h2>
                    <p>Si asumimos que existe un clonador unitario \\(\\hat{U}\\), llegamos a la condición:</p>
                    <p>\\( \\langle\\psi|\\phi\\rangle = (\\langle\\psi|\\phi\\rangle)^2 \\)</p>
                    <p>Esto implica que \\(\\langle\\psi|\\phi\\rangle\\) debe ser <b>0</b> (estados ortogonales) o <b>1</b> (estados idénticos). No se pueden clonar estados arbitrarios que no cumplan esto.</p>
                   `
            },
            {
                question: "La prueba del teorema basada en la <b>linealidad</b> muestra que al intentar clonar una superposición \\(\\alpha|0\\rangle + \\beta|1\\rangle\\), la máquina produce:",

                    "\\((\\alpha|0\\rangle + \\beta|1\\rangle) \\otimes (\\alpha|0\\rangle + \\beta|1\\rangle)\\) (clonación exitosa).",
                    "El estado nulo."
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto.",
                    "¡Correcto! La linealidad obliga a la máquina a actuar sobre cada componente (con su ancilla) por separado: \\(\\hat{U}((\\alpha|0\\rangle + \\beta|1\\rangle)\\otimes|0\\rangle) = \\alpha \\hat{U}|00\\rangle + \\beta \\hat{U}|10\\rangle = \\alpha|00\\rangle + \\beta|11\\rangle\\).",

                   `
            },
            {
                question: "¿Cuál de las siguientes es una implicación directa del Teorema de No-Clonación?",
                options: [
                    "Podemos enviar información más rápido que la luz.",

                correctAnswer: 2,
                feedback: [

                        <li><b>Corrección de Errores:</b> No podemos hacer 'backups' simples de qubits.</li>

                   `

            {

                correctAnswer: 1,

            },

                feedback: [
                    "Incorrecto. Eso es para base X.",
                    "Incorrecto.",
                    "¡Correcto! La base Y se crea con \\(S \\cdot H\\). Para medir, aplicamos la inversa: \\((SH)^\\dagger = H^\\dagger S^\\dagger = H S^\\dagger\\). En Qiskit, aplicamos `sdg` y luego `h`.",

                ],

        // --- FUNCIÓN DE FORMATEO DE TEXTO PARA EL PROBLEMA DE MARKDOWN ---
        // Convierte el markdown simple en etiquetas HTML válidas
        function formatText(text) {
            if (!text) return text;
            // Reemplazar `codigo` por <code>codigo</code>
            let html = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Reemplazar **negrita** por <b>negrita</b>
            html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
            // Reemplazar *cursiva* por <i>cursiva</i>
            html = html.replace(/\*([^*]+)\*/g, '<i>$1</i>');
            return html;
        }

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        const questionCounterEl = document.getElementById('question-counter');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackPanelEl = document.getElementById('feedback-panel');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContentEl = document.getElementById('quiz-content');
        const scoreContainerEl = document.getElementById('score-container');
        const scoreTextEl = document.getElementById('score-text');
        const hintSectionEl = document.getElementById('hint-section');
        const modalEl = document.getElementById('theory-modal');
        const modalTextEl = document.getElementById('modal-text');


        function displayQuestion() {
            feedbackPanelEl.style.display = 'none';
            optionsContainerEl.innerHTML = '';
            hintSectionEl.innerHTML = '';

            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];

            questionCounterEl.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;

            // APLICAMOS EL FORMATEO AQUÍ (para convertir `...` y **...**)
            questionTextEl.innerHTML = formatText(currentQuestion.question);

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                // APLICAMOS EL FORMATEO AQUÍ TAMBIÉN
                button.innerHTML = formatText(option);
                button.className = 'option-btn';
                button.onclick = () => checkAnswer(index);
                optionsContainerEl.appendChild(button);
            });

            // Add Hint functionality
            if(currentQuestion.hint) {
                const hintBtn = document.createElement('button');
                hintBtn.textContent = 'Necesito una pista';
                hintBtn.className = 'hint-btn';
                const hintText = document.createElement('div');
                hintText.id = 'hint-text';
                // APLICAMOS EL FORMATEO AQUÍ TAMBIÉN
                hintText.innerHTML = formatText(currentQuestion.hint);
                hintBtn.onclick = () => {
                    hintText.style.display = 'block';
                    hintBtn.style.display = 'none';
                };
                hintSectionEl.appendChild(hintBtn);
                hintSectionEl.appendChild(hintText);
            }

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }

            updateNavButtons();

            if(userAnswers[currentQuestionIndex] !== null){
                showPreviousAnswer();
            }
        }

        function showPreviousAnswer(){
            const userAnswer = userAnswers[currentQuestionIndex];
            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer;
            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            const hintBtn = hintSectionEl.querySelector('.hint-btn');
            if(hintBtn) hintBtn.style.display = 'none';


            optionButtons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === userAnswer.selectedIndex) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            // APLICAMOS EL FORMATEO AQUÍ TAMBIÉN
            feedbackPanelEl.innerHTML = `<p>${formatText(currentQuestion.feedback[userAnswer.selectedIndex])}</p>`;

            if (currentQuestion.theoryHTML) {
                const theoryBtn = document.createElement('button');
                theoryBtn.textContent = 'Ver Teoría';
                theoryBtn.className = 'theory-btn';
                theoryBtn.onclick = () => showTheory(currentQuestion.theoryHTML);
                feedbackPanelEl.appendChild(theoryBtn);
            }

            feedbackPanelEl.className = userAnswer.isCorrect ? 'correct-feedback' : 'incorrect-feedback';
            feedbackPanelEl.style.display = 'block';

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex) {
            if(userAnswers[currentQuestionIndex] !== null) return;

            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correctAnswer;

            userAnswers[currentQuestionIndex] = { selectedIndex, isCorrect };

            if(isCorrect) {
                score++;
            }

            showPreviousAnswer();
        }

        function showTheory(htmlContent) {
            modalTextEl.innerHTML = htmlContent;
            modalEl.style.display = 'flex';
            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset([modalTextEl]);
            }
        }

        function closeModal() {
            modalEl.style.display = 'none';
        }

        function updateNavButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length -1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                 nextBtn.textContent = 'Siguiente';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function showScore(){
            quizContentEl.style.display = 'none';
            document.querySelector('.navigation-controls').style.display = 'none';
            scoreContainerEl.style.display = 'block';

            scoreTextEl.textContent = `Tu puntuación es ${score} de ${quizData.length}.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;

            scoreContainerEl.style.display = 'none';
            quizContentEl.style.display = 'block';
            document.querySelector('.navigation-controls').style.display = 'flex';

            displayQuestion();
        }

        // Iniciar el cuestionario
        displayQuestion();
