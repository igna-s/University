<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Transformaciones Lineales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        canvas {
            cursor: move;
            touch-action: none;
        }
        /* Estilo para el interruptor (toggle switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #60a5fa;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .dark .slider {
            background-color: #4a4a50;
        }
        .dark input:checked + .slider {
             background-color: #60a5fa;
        }

        .control-panel input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 8px;
            border-radius: 5px; outline: none; opacity: 0.7;
            transition: opacity .2s;
        }
         .control-panel input[type="range"]:hover { opacity: 1; }
        .control-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; background: #3b82f6;
            cursor: pointer; border-radius: 50%;
        }
         .control-panel input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px; background: #3b82f6;
            cursor: pointer; border-radius: 50%;
        }

        .dark .control-panel input[type="range"]::-webkit-slider-thumb { background: #60a5fa; }
        .dark .control-panel input[type="range"]::-moz-range-thumb { background: #60a5fa; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-white flex flex-col lg:flex-row h-screen overflow-hidden">

    <!-- Panel de Controles -->
    <div class="control-panel bg-white dark:bg-gray-800 p-4 lg:p-6 lg:w-96 order-2 lg:order-1 flex-shrink-0 overflow-y-auto">
        <h1 class="text-2xl font-bold mb-4 text-center">Transformación Lineal</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6 text-center">Define la transformación arrastrando los vectores en el lienzo o usando los controles.</p>

        <div class="space-y-6">
            <!-- Controles de Vectores -->
            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md">
                <div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold">Vector Base <span class="text-green-600 dark:text-green-400 font-mono">î</span></h2><span class="text-green-600 dark:text-green-400 font-mono text-lg font-bold">T(î)</span></div>
                <div class="flex justify-around items-center">
                    <div class="flex flex-col items-center"><label for="ti-x" class="mb-1 text-sm">x</label><input type="number" id="ti-x" value="1" step="0.1" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 w-20 text-center"></div>
                    <div class="flex flex-col items-center"><label for="ti-y" class="mb-1 text-sm">y</label><input type="number" id="ti-y" value="0" step="0.1" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 w-20 text-center"></div>
                </div>
            </div>
            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md">
                <div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold">Vector Base <span class="text-red-600 dark:text-red-400 font-mono">ĵ</span></h2><span class="text-red-600 dark:text-red-400 font-mono text-lg font-bold">T(ĵ)</span></div>
                <div class="flex justify-around items-center">
                    <div class="flex flex-col items-center"><label for="tj-x" class="mb-1 text-sm">x</label><input type="number" id="tj-x" value="0" step="0.1" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 w-20 text-center"></div>
                    <div class="flex flex-col items-center"><label for="tj-y" class="mb-1 text-sm">y</label><input type="number" id="tj-y" value="1" step="0.1" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 w-20 text-center"></div>
                </div>
            </div>

            <!-- Visualización de la Matriz -->
            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md">
                <h3 class="text-lg font-semibold mb-3 text-center">Matriz de Transformación</h3>
                <div class="flex items-center justify-center space-x-2 text-2xl font-mono">
                    <div class="text-6xl font-light text-gray-400 dark:text-gray-500">[</div>
                    <div class="flex flex-col items-center space-y-2">
                        <div id="matrix-a" class="bg-white dark:bg-gray-700 py-2 px-4 rounded min-w-[50px] text-center text-green-600 dark:text-green-400">1.0</div>
                        <div id="matrix-b" class="bg-white dark:bg-gray-700 py-2 px-4 rounded min-w-[50px] text-center text-green-600 dark:text-green-400">0.0</div>
                    </div>
                    <div class="flex flex-col items-center space-y-2">
                        <div id="matrix-c" class="bg-white dark:bg-gray-700 py-2 px-4 rounded min-w-[50px] text-center text-red-600 dark:text-red-400">0.0</div>
                        <div id="matrix-d" class="bg-white dark:bg-gray-700 py-2 px-4 rounded min-w-[50px] text-center text-red-600 dark:text-red-400">1.0</div>
                    </div>
                    <div class="text-6xl font-light text-gray-400 dark:text-gray-500">]</div>
                </div>
            </div>

            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md">
                <div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold">Vector Personalizado <span class="text-yellow-500 dark:text-yellow-400 font-mono">v</span></h2></div>
                <div class="flex justify-around items-center">
                    <div class="flex flex-col items-center"><label for="v-x" class="mb-1 text-sm">x</label><input type="number" id="v-x" value="2" step="0.1" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 w-20 text-center"></div>
                    <div class="flex flex-col items-center"><label for="v-y" class="mb-1 text-sm">y</label><input type="number" id="v-y" value="1" step="0.1" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 w-20 text-center"></div>
                </div>
            </div>
            <!-- Controles de Visibilidad -->
            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md"><label for="grid-opacity" class="block text-lg font-semibold mb-2 text-center">Visibilidad Cuadrícula Original</label><input type="range" id="grid-opacity" min="0" max="100" value="100" class="w-full bg-gray-200 dark:bg-gray-700"></div>
            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md"><label for="transformed-grid-opacity" class="block text-lg font-semibold mb-2 text-center">Visibilidad Cuadrícula Transformada</label><input type="range" id="transformed-grid-opacity" min="0" max="100" value="100" class="w-full bg-gray-200 dark:bg-gray-700"></div>
            <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center">
                    <span class="text-lg font-semibold">Mostrar Etiquetas de Ejes</span>
                    <label class="switch">
                        <input type="checkbox" id="show-axis-labels-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
             <div class="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center">
                    <span class="text-lg font-semibold">Modo Claro</span>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mt-8 space-y-4 text-center">
            <button id="reset-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors w-full">
                Reiniciar Transformación
            </button>
        </div>
    </div>

    <!-- Canvas para la Visualización -->
    <div class="flex-grow w-full h-full order-1 lg:order-2">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Referencias a los inputs
        const ti_x_input = document.getElementById('ti-x');
        const ti_y_input = document.getElementById('ti-y');
        const tj_x_input = document.getElementById('tj-x');
        const tj_y_input = document.getElementById('tj-y');
        const v_x_input = document.getElementById('v-x');
        const v_y_input = document.getElementById('v-y');
        const resetButton = document.getElementById('reset-btn');
        const gridOpacitySlider = document.getElementById('grid-opacity');
        const transformedGridOpacitySlider = document.getElementById('transformed-grid-opacity');
        const showAxisLabelsToggle = document.getElementById('show-axis-labels-toggle');
        const themeToggle = document.getElementById('theme-toggle');

        const matrix_a = document.getElementById('matrix-a');
        const matrix_b = document.getElementById('matrix-b');
        const matrix_c = document.getElementById('matrix-c');
        const matrix_d = document.getElementById('matrix-d');

        // --- Configuración del Canvas ---
        let scale = 40;
        let origin = { x: 0, y: 0 };
        let panOffset = { x: 0, y: 0 };
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let draggedVector = null;
        const DRAG_RADIUS = 0.5;

        // --- Paletas de Colores ---
        const darkThemeColors = {
            background: '#1a1a1a', originalGrid: '#888888', originalAxes: '#ffffff',
            transformedGrid: '#0e7490', transformedAxes: '#22d3ee',
            i_hat: '#4ade80', j_hat: '#f87171', v_vec: '#facc15',
            ti_hat: '#a7f3d0', tj_hat: '#fca5a5', tv_vec: '#fde047',
            text: '#e0e0e0', axisLabel: '#b0b0b0'
        };

        const lightThemeColors = {
            background: '#f3f4f6', originalGrid: '#d1d5db', originalAxes: '#111827',
            transformedGrid: '#0891b2', transformedAxes: '#06b6d4',
            i_hat: '#166534', j_hat: '#991b1b', v_vec: '#d97706',
            ti_hat: '#15803d', tj_hat: '#b91c1c', tv_vec: '#ca8a04',
            text: '#111827', axisLabel: '#4b5563'
        };

        let currentColors = darkThemeColors;

        // --- Funciones de Utilidad y Transformación ---
        function hexToRgba(hex, alpha) {
            let r=0,g=0,b=0;
            if(hex.length==7){r=parseInt(hex.substring(1,3),16);g=parseInt(hex.substring(3,5),16);b=parseInt(hex.substring(5,7),16);}
            return `rgba(${r},${g},${b},${alpha})`;
        }
        function worldToCanvas(x, y) { return { x: origin.x + panOffset.x + x * scale, y: origin.y + panOffset.y - y * scale }; }
        function canvasToWorld(x, y) { return { x: (x - origin.x - panOffset.x) / scale, y: (origin.y + panOffset.y - y) / scale }; }
        function applyTransform(vec, matrix) {
            const [[a, c], [b, d]] = matrix;
            return { x: a * vec.x + c * vec.y, y: b * vec.x + d * vec.y };
        }

        // --- Funciones de Dibujo ---
        function drawGrid(opacity, matrix = null) {
            if (opacity === 0) return;
            const center = canvasToWorld(canvas.width/2, canvas.height/2), worldWidth = canvas.width/scale, worldHeight = canvas.height/scale;
            const startX = Math.floor(center.x-worldWidth), endX = Math.ceil(center.x+worldWidth);
            const startY = Math.floor(center.y-worldHeight), endY = Math.ceil(center.y+worldHeight);

            const gridColor = matrix ? hexToRgba(currentColors.transformedGrid, opacity) : hexToRgba(currentColors.originalGrid, opacity);
            const axesColor = matrix ? hexToRgba(currentColors.transformedAxes, opacity) : hexToRgba(currentColors.originalAxes, opacity);

            for (let i = startX; i <= endX; i++) {
                const p1_world={x:i,y:startY}, p2_world={x:i,y:endY};
                const p1_final = matrix ? applyTransform(p1_world, matrix) : p1_world, p2_final = matrix ? applyTransform(p2_world, matrix) : p2_world;
                const p1_c=worldToCanvas(p1_final.x,p1_final.y), p2_c=worldToCanvas(p2_final.x,p2_final.y);
                ctx.strokeStyle=(i===0)?axesColor:gridColor; ctx.lineWidth=(i===0)?2:1;
                ctx.beginPath(); ctx.moveTo(p1_c.x, p1_c.y); ctx.lineTo(p2_c.x, p2_c.y); ctx.stroke();
            }
            for (let j = startY; j <= endY; j++) {
                const p1_world={x:startX,y:j}, p2_world={x:endX,y:j};
                const p1_final = matrix ? applyTransform(p1_world, matrix) : p1_world, p2_final = matrix ? applyTransform(p2_world, matrix) : p2_world;
                const p1_c=worldToCanvas(p1_final.x,p1_final.y), p2_c=worldToCanvas(p2_final.x,p2_final.y);
                ctx.strokeStyle=(j===0)?axesColor:gridColor; ctx.lineWidth=(j===0)?2:1;
                ctx.beginPath(); ctx.moveTo(p1_c.x,p1_c.y); ctx.lineTo(p2_c.x, p2_c.y); ctx.stroke();
            }
            if (!matrix && showAxisLabelsToggle.checked) {
                drawAxisLabels(startX, endX, startY, endY, opacity);
            }
        }
        function drawAxisLabels(startX, endX, startY, endY, opacity) {
            ctx.fillStyle = hexToRgba(currentColors.axisLabel, opacity);
            ctx.font = `${Math.min(14, scale / 2.5)}px Inter`;

            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            for (let i = startX; i <= endX; i++) {
                if (i === 0 || Math.abs(i * scale) < 20) continue;
                const pos = worldToCanvas(i, 0);
                ctx.fillText(i, pos.x, pos.y + 8);
            }
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            for (let j = startY; j <= endY; j++) {
                if (j === 0 || Math.abs(j * scale) < 20) continue;
                const pos = worldToCanvas(0, j);
                ctx.fillText(j, pos.x - 8, pos.y);
            }
        }
        function drawVector(vec, color, label) {
            const end = worldToCanvas(vec.x, vec.y), start = worldToCanvas(0, 0);
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(end.x, end.y); ctx.stroke();
            const angle = Math.atan2(end.y-start.y, end.x-start.x), headlen = 10;
            ctx.beginPath();ctx.moveTo(end.x, end.y);
            ctx.lineTo(end.x-headlen*Math.cos(angle-Math.PI/6), end.y-headlen*Math.sin(angle-Math.PI/6));
            ctx.lineTo(end.x-headlen*Math.cos(angle+Math.PI/6), end.y-headlen*Math.sin(angle+Math.PI/6));
            ctx.closePath();ctx.fill();

            ctx.font = '16px Inter'; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const linearOffset = 18, perpOffset = 10;
            let labelX = end.x + linearOffset * Math.cos(angle);
            let labelY = end.y + linearOffset * Math.sin(angle);
            const perpAngle = angle + Math.PI / 2;
            labelX += perpOffset * Math.cos(perpAngle);
            labelY += perpOffset * Math.sin(perpAngle);
            ctx.fillText(label, labelX, labelY);
        }
        function drawScene() {
            ctx.fillStyle = currentColors.background; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const ti = { x: parseFloat(ti_x_input.value), y: parseFloat(ti_y_input.value) };
            const tj = { x: parseFloat(tj_x_input.value), y: parseFloat(tj_y_input.value) };
            const v = { x: parseFloat(v_x_input.value), y: parseFloat(v_y_input.value) };
            const transformMatrix = [ [ti.x, tj.x], [ti.y, tj.y] ];

            matrix_a.textContent = ti.x.toFixed(1); matrix_b.textContent = ti.y.toFixed(1);
            matrix_c.textContent = tj.x.toFixed(1); matrix_d.textContent = tj.y.toFixed(1);

            drawGrid(parseInt(gridOpacitySlider.value)/100);
            drawGrid(parseInt(transformedGridOpacitySlider.value)/100, transformMatrix);
            drawVector(v, currentColors.v_vec, 'v');
            const tv = applyTransform(v, transformMatrix);
            drawVector(ti, currentColors.ti_hat, 'T(î)');
            drawVector(tj, currentColors.tj_hat, 'T(ĵ)');
            drawVector(tv, currentColors.tv_vec, 'T(v)');
        }

        // --- Lógica de Interacción ---
        function findVectorToDrag(worldPos) {
            const v = { x: parseFloat(v_x_input.value), y: parseFloat(v_y_input.value) };
            const ti = { x: parseFloat(ti_x_input.value), y: parseFloat(ti_y_input.value) };
            const tj = { x: parseFloat(tj_x_input.value), y: parseFloat(tj_y_input.value) };
            if(Math.hypot(worldPos.x-v.x, worldPos.y-v.y) < DRAG_RADIUS) return 'v';
            if(Math.hypot(worldPos.x-tj.x, worldPos.y-tj.y) < DRAG_RADIUS) return 'tj';
            if(Math.hypot(worldPos.x-ti.x, worldPos.y-ti.y) < DRAG_RADIUS) return 'ti';
            return null;
        }
        function getEventCoords(event) {
            const rect = canvas.getBoundingClientRect();
            if (event.touches) { return { x: event.touches[0].clientX-rect.left, y: event.touches[0].clientY-rect.top }; }
            return { x: event.clientX-rect.left, y: event.clientY-rect.top };
        }
        function handleInteractionStart(event) {
            const coords = getEventCoords(event);
            const worldPos = canvasToWorld(coords.x, coords.y);
            draggedVector = findVectorToDrag(worldPos);
            if (!draggedVector) {
                isPanning = true;
                panStart.x = event.clientX || event.touches[0].clientX;
                panStart.y = event.clientY || event.touches[0].clientY;
            }
        }
        function handleInteractionMove(event) {
            event.preventDefault();
            const coords = getEventCoords(event);
            const worldPos = canvasToWorld(coords.x, coords.y);
            if (draggedVector) {
                const newX = Math.round(worldPos.x*10)/10, newY = Math.round(worldPos.y*10)/10;
                if(draggedVector==='ti'){ti_x_input.value=newX;ti_y_input.value=newY;}
                else if(draggedVector==='tj'){tj_x_input.value=newX;tj_y_input.value=newY;}
                else if(draggedVector==='v'){v_x_input.value=newX;v_y_input.value=newY;}
                drawScene();
            } else if (isPanning) {
                const currentX=event.clientX||event.touches[0].clientX, currentY=event.clientY||event.touches[0].clientY;
                panOffset.x += currentX - panStart.x; panOffset.y += currentY - panStart.y;
                panStart.x = currentX; panStart.y = currentY;
                drawScene();
            } else { canvas.style.cursor = findVectorToDrag(worldPos) ? 'grab' : 'move'; }
        }
        function handleInteractionEnd() {
            if (draggedVector) canvas.style.cursor = 'move';
            draggedVector = null; isPanning = false;
        }

        // --- Event Listeners ---
        function handleResize() {
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth; canvas.height = parent.clientHeight;
            origin.x = canvas.width/2; origin.y = canvas.height/2;
            drawScene();
        }
        function handleZoom(event) {
            event.preventDefault();
            const zoomIntensity=0.1, wheel=event.deltaY<0?1:-1, zoom=Math.exp(wheel*zoomIntensity);
            const rect=canvas.getBoundingClientRect();
            const mousePos={x:event.clientX-rect.left,y:event.clientY-rect.top};
            const worldPosBeforeZoom = canvasToWorld(mousePos.x, mousePos.y);
            scale *= zoom;
            const worldPosAfterZoom = canvasToWorld(mousePos.x, mousePos.y);
            panOffset.x += (worldPosAfterZoom.x-worldPosBeforeZoom.x)*scale;
            panOffset.y += (worldPosAfterZoom.y-worldPosBeforeZoom.y)*scale;
            drawScene();
        }
        function reset() {
            ti_x_input.value = 1; ti_y_input.value = 0; tj_x_input.value = 0; tj_y_input.value = 1;
            v_x_input.value = 2; v_y_input.value = 1;
            gridOpacitySlider.value = 100; transformedGridOpacitySlider.value = 100;
            showAxisLabelsToggle.checked = true;
            panOffset={x:0,y:0};scale=40;
            drawScene();
        }

        // --- Inicialización ---
        window.addEventListener('resize', handleResize);
        [ti_x_input,ti_y_input,tj_x_input,tj_y_input,v_x_input,v_y_input,gridOpacitySlider,transformedGridOpacitySlider,showAxisLabelsToggle].forEach(input=>{input.addEventListener('input',drawScene);});
        resetButton.addEventListener('click', reset);

        themeToggle.addEventListener('change', () => {
            document.documentElement.classList.toggle('dark', !themeToggle.checked);
            currentColors = themeToggle.checked ? lightThemeColors : darkThemeColors;
            drawScene();
        });

        canvas.addEventListener('wheel', handleZoom);
        canvas.addEventListener('mousedown', handleInteractionStart);
        canvas.addEventListener('mousemove', handleInteractionMove);
        canvas.addEventListener('mouseup', handleInteractionEnd);
        canvas.addEventListener('mouseleave', handleInteractionEnd);
        canvas.addEventListener('touchstart', handleInteractionStart, {passive:false});
        canvas.addEventListener('touchmove', handleInteractionMove, {passive:false});
        canvas.addEventListener('touchend', handleInteractionEnd);
        canvas.addEventListener('touchcancel', handleInteractionEnd);

        handleResize();
    </script>
</body>
</html>
