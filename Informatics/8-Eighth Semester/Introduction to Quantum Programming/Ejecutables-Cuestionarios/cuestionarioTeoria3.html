    <script>

                theoryHTML: `<h2>Definición Formal de los Números Complejos</h2>

                    <ol>
                        <li><b>Suma:</b> \\( (a,b) + (c,d) = (a+c, b+d) \\)</li>

            {

                correctAnswer: 2,
                feedback: [

                theoryHTML: `<h2>Demostración de \\(i^2 = -1\\)</h2>

                    <p>\\( i \\cdot i = (0,1) \\cdot (0,1) \\)</p>
                    <p>Usamos la regla \\((a,b)\\cdot(c,d) = (ac-bd, ad+bc)\\), con \\(a=0, b=1, c=0, d=1\\):</p>
                    <p>\\( i \\cdot i = ( 0 \\cdot 0 - 1 \\cdot 1, 0 \\cdot 1 + 1 \\cdot 0 ) = (-1, 0) \\)</p>
                    <p>Y como habíamos identificado que los pares de la forma \\((x,0)\\) se corresponden con el número real \\(x\\), tenemos que:</p>

            {
                question: "Si \\( z = a + bi \\), su conjugado complejo \\( z^* \\) es:",

            {

            {

                    <p>Por lo tanto, la identidad fundamental es:</p>
                    <p style="text-align:center;">\\( |z|^2 = z \\cdot z^* \\)</p>`

            {

                theoryHTML: `<h2>La Fórmula de Euler</h2>

            {

                options: [ "Sumar sus módulos y sumar sus ángulos.", "Multiplicar sus módulos y sumar sus ángulos.", "Multiplicar sus módulos y multiplicar sus ángulos.", "Sumar sus módulos y multiplicar sus ángulos." ],

                theoryHTML: `<h2>Bra - \\(\\langle \\psi |\\)</h2>

            },
            {

                correctAnswer: 1,
                feedback: [
                    "Incorrecto. La distancia está más relacionada con la norma de la diferencia de vectores.",
                    "¡Correcto! En espacios reales, esta desigualdad se deriva de la fórmula del producto escalar que involucra \\(\\cos(\\theta)\\). En espacios complejos, donde no podemos visualizar un ángulo simple, la desigualdad captura la idea de 'cuánto se alinean' dos vectores.",

                ],
                hint: "En espacios reales, el producto escalar se relaciona con el coseno de algo. ¿Qué es ese algo?",
                theoryHTML: `<h2>La Desigualdad de Cauchy-Schwarz</h2>
                    <p>En espacios reales, la fórmula del ángulo es \\( \\langle u, v \\rangle = \\|u\\| \\|v\\| \\cos(\\theta) \\). Como \\(|\\cos(\\theta)| \\le 1\\), esto implica \\(|\\langle u, v \\rangle| \\le \\|u\\| \\|v\\|\\).</p>
                    <p>Esta idea sobrevive en los espacios complejos y se convierte en un pilar fundamental:</p>
                    <p>Para <b>cualesquiera</b> dos vectores \\(|u\\rangle\\) y \\(|v\\rangle\\) en un Espacio de Hilbert, se cumple:</p>

            {

                options: [ "\\( k \\langle \\phi | \\psi \\rangle \\)", "\\( k^* \\langle \\phi | \\psi \\rangle \\)", "\\( k \\langle \\psi | \\phi \\rangle \\)", "\\( \\langle \\phi | k^*\\psi \\rangle \\)" ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. El escalar sale sin conjugar cuando está en el segundo argumento (el ket).",
                    "¡Correcto! El producto interior es 'casi' lineal en el primer argumento, pero el escalar sale conjugado. A esto se le llama antilinealidad o conjugado-linealidad.",

                ],
                hint: "El producto interior es lineal en el ket, pero 'conjugado-lineal' en el bra.",
                theoryHTML: `<h2>Propiedades del Producto Interior Complejo</h2>
                    <p><b>3. Anti-Linealidad (en el Bra):</b> Es "casi" lineal en el <b>primer</b> argumento, pero el escalar sale <b>conjugado</b>.</p>
                    <p style="text-align:center;">\\( \\langle k\\phi | \\psi \\rangle = k^* \\langle \\phi | \\psi \\rangle \\)</p>`
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        const questionCounterEl = document.getElementById('question-counter');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackPanelEl = document.getElementById('feedback-panel');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContentEl = document.getElementById('quiz-content');
        const scoreContainerEl = document.getElementById('score-container');
        const scoreTextEl = document.getElementById('score-text');
        const hintSectionEl = document.getElementById('hint-section');
        const modalEl = document.getElementById('theory-modal');
        const modalTextEl = document.getElementById('modal-text');


        function displayQuestion() {
            feedbackPanelEl.style.display = 'none';
            optionsContainerEl.innerHTML = '';
            hintSectionEl.innerHTML = '';

            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];

            questionCounterEl.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            questionTextEl.innerHTML = currentQuestion.question;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = option;
                button.className = 'option-btn';
                button.onclick = () => checkAnswer(index);
                optionsContainerEl.appendChild(button);
            });

            // Add Hint functionality
            const hintBtn = document.createElement('button');
            hintBtn.textContent = 'Necesito una pista';
            hintBtn.className = 'hint-btn';
            const hintText = document.createElement('div');
            hintText.id = 'hint-text';
            hintText.innerHTML = currentQuestion.hint;
            hintBtn.onclick = () => {
                hintText.style.display = 'block';
                hintBtn.style.display = 'none';
            };
            hintSectionEl.appendChild(hintBtn);
            hintSectionEl.appendChild(hintText);

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }

            updateNavButtons();

            if(userAnswers[currentQuestionIndex] !== null){
                showPreviousAnswer();
            }
        }

        function showPreviousAnswer(){
            const userAnswer = userAnswers[currentQuestionIndex];
            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer;
            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            const hintBtn = hintSectionEl.querySelector('.hint-btn');
            if(hintBtn) hintBtn.style.display = 'none';


            optionButtons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === userAnswer.selectedIndex) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            feedbackPanelEl.innerHTML = `<p>${currentQuestion.feedback[userAnswer.selectedIndex]}</p>`;

            const theoryBtn = document.createElement('button');
            theoryBtn.textContent = 'Ver Teoría';
            theoryBtn.className = 'theory-btn';
            theoryBtn.onclick = () => showTheory(currentQuestion.theoryHTML);
            feedbackPanelEl.appendChild(theoryBtn);

            feedbackPanelEl.className = userAnswer.isCorrect ? 'correct-feedback' : 'incorrect-feedback';
            feedbackPanelEl.style.display = 'block';

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex) {
            if(userAnswers[currentQuestionIndex] !== null) return;

            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correctAnswer;

            userAnswers[currentQuestionIndex] = { selectedIndex, isCorrect };

            if(isCorrect) {
                score++;
            }

            showPreviousAnswer();
        }

        function showTheory(htmlContent) {
            modalTextEl.innerHTML = htmlContent;
            modalEl.style.display = 'flex';
            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset([modalTextEl]);
            }
        }

        function closeModal() {
            modalEl.style.display = 'none';
        }

        function updateNavButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length -1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                 nextBtn.textContent = 'Siguiente';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function showScore(){
            quizContentEl.style.display = 'none';
            document.querySelector('.navigation-controls').style.display = 'none';
            scoreContainerEl.style.display = 'block';

            scoreTextEl.textContent = `Tu puntuación es ${score} de ${quizData.length}.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;

            scoreContainerEl.style.display = 'none';
            quizContentEl.style.display = 'block';
            document.querySelector('.navigation-controls').style.display = 'flex';

            displayQuestion();
        }

        // Iniciar el cuestionario
        displayQuestion();
    </script>
