    <script>
        const quizData = [
            {
                question: "Un operador lineal \\( \\hat{A} \\) queda completamente definido por:",
                options: [
                    "Su matriz adjunta.",
                    "La forma en que actúa sobre cualquier vector del espacio.",
                    "La forma en que actúa sobre los vectores de una base.",
                    "Su producto externo."
                ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. La matriz adjunta es una propiedad del operador, pero no lo define por completo.",
                    "Incorrecto. Si bien es cierto, es una definición demasiado general. Se necesita algo más específico.",
                    "¡Correcto! Debido a la linealidad, si conocemos cómo un operador transforma los vectores de la base, podemos determinar cómo transformará cualquier combinación lineal de ellos, es decir, cualquier vector del espacio.",
                    "Incorrecto. El producto externo es una forma de construir operadores, pero no todos los operadores se definen directamente así."
                ],
                hint: "Piensa en la propiedad de linealidad y cómo se aplica a una combinación lineal de vectores base.",
                theoryHTML: `<h2>Operadores como Matrices</h2>
                    <p>Un operador <b>lineal</b> queda <b>completamente definido</b> por la forma en que actúa sobre los vectores de una base. Si conocemos \\(\\hat{A}|0\\rangle\\) y \\(\\hat{A}|1\\rangle\\), conocemos \\(\\hat{A}|\\psi\\rangle\\) para cualquier \\(|\\psi\\rangle\\).</p>
                    <p>Esto se debe a que cualquier \\(|\\psi\\rangle = \\alpha|0\\rangle + \\beta|1\\rangle\\), y por linealidad, \\(\\hat{A}|\\psi\\rangle = \\alpha(\\hat{A}|0\\rangle) + \\beta(\\hat{A}|1\\rangle)\\).</p>`
            },
            {
                question: "¿Cuál es la primera columna de la matriz que representa a un operador \\( \\hat{A} \\) en la base computacional?",
                options: [
                    "El vector \\( \\langle 0 | \\hat{A} | 0 \\rangle \\)",
                    "El vector \\( \\hat{A}|1\\rangle \\)",
                    "El vector \\( \\hat{A}|0\\rangle \\)",
                    "El vector \\( \\langle 1 | \\hat{A} | 0 \\rangle \\)"
                ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. Esto corresponde al elemento \\(M_{00}\\) de la matriz, no a la columna entera.",
                    "Incorrecto. Este vector corresponde a la segunda columna de la matriz.",
                    "¡Correcto! La receta para construir la matriz de un operador es que la j-ésima columna es el vector resultante de aplicar el operador al j-ésimo vector de la base. Por tanto, la primera columna es \\(\\hat{A}|0\\rangle\\).",
                    "Incorrecto. Esto corresponde al elemento \\(M_{10}\\) de la matriz."
                ],
                hint: "La receta para construir la matriz \\(M\\) es \\( M = \\begin{pmatrix} | & | \\\\ \\hat{A}|0\\rangle & \\hat{A}|1\\rangle \\\\ | & | \\end{pmatrix} \\).",
                theoryHTML: `<h2>La receta para construir la matriz de un operador</h2>
                    <p>La matriz \\(M\\) de un operador \\(\\hat{A}\\) se construye de la siguiente manera:</p>
                    <ul>
                        <li><b>Primera Columna:</b> El vector resultante \\(\\hat{A}|0\\rangle\\).</li>
                        <li><b>Segunda Columna:</b> El vector resultante \\(\\hat{A}|1\\rangle\\).</li>
                    </ul>
                    <p style="text-align:center;">\\( M = \\begin{pmatrix} | & | \\\\ \\hat{A}|0\\rangle & \\hat{A}|1\\rangle \\\\ | & | \\end{pmatrix} \\)</p>
                    <p>La fórmula para cada elemento es \\(M_{ij} = \\langle i | \\hat{A} | j \\rangle\\).</p>`
            },
            {
                question: "¿Cuál de las siguientes es la matriz de la compuerta Pauli-X (NOT)?",
                options: [
                    "\\( \\begin{pmatrix} 1 & 0 \\\\ 0 & 1 \\end{pmatrix} \\)",
                    "\\( \\begin{pmatrix} 1 & 0 \\\\ 0 & -1 \\end{pmatrix} \\)",
                    "\\( \\begin{pmatrix} 0 & 1 \\\\ 1 & 0 \\end{pmatrix} \\)",
                    "\\( \\frac{1}{\\sqrt{2}}\\begin{pmatrix} 1 & 1 \\\\ 1 & -1 \\end{pmatrix} \\)"
                ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. Esta es la matriz Identidad (I).",
                    "Incorrecto. Esta es la matriz Pauli-Z.",
                    "¡Correcto! La compuerta X transforma \\(|0\\rangle\\) en \\(|1\\rangle = \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix}\\) (primera columna) y \\(|1\\rangle\\) en \\(|0\\rangle = \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix}\\) (segunda columna).",
                    "Incorrecto. Esta es la matriz de Hadamard (H)."
                ],
                hint: "Esta compuerta intercambia (hace un 'flip') los estados \\(|0\\rangle\\) y \\(|1\\rangle\\).",
                theoryHTML: `<h2>Compuerta Pauli-X (NOT o Bit-Flip)</h2>
                    <ul>
                        <li><b>Acción:</b> Invierte el estado. Análogo a la compuerta NOT clásica.</li>
                        <li>\\(\\hat{X}|0\\rangle = |1\\rangle\\)</li>
                        <li>\\(\\hat{X}|1\\rangle = |0\\rangle\\)</li>
                    </ul>
                    <p>Usando la receta de construcción:</p>
                    <ul>
                        <li>Primera columna: \\(\\hat{X}|0\\rangle = |1\\rangle = \\begin{pmatrix} 0 \\\\ 1 \\end{pmatrix}\\)</li>
                        <li>Segunda columna: \\(\\hat{X}|1\\rangle = |0\\rangle = \\begin{pmatrix} 1 \\\\ 0 \\end{pmatrix}\\)</li>
                    </ul>
                    <p><b>Matriz:</b> \\( X = \\begin{pmatrix} 0 & 1 \\\\ 1 & 0 \\end{pmatrix} \\)</p>`
            },
            {
                question: "La compuerta Hadamard (H) aplicada al estado \\( |1\\rangle \\) da como resultado el estado:",
                options: [
                    "\\( |0\\rangle \\)",
                    "\\( |+\\rangle \\)",
                    "\\( |-\\rangle \\)",
                    "\\( |1\\rangle \\)"
                ],
                correctAnswer: 2,
                feedback: [
                    "Incorrecto. La compuerta H aplicada a \\(|+\\rangle\\) da como resultado \\(|0\\rangle\\).",
                    "Incorrecto. La compuerta H aplicada a \\(|0\\rangle\\) da como resultado \\(|+\\rangle\\).",
                    "¡Correcto! La compuerta de Hadamard crea superposiciones. Específicamente, \\( H|1\\rangle = \\frac{|0\\rangle - |1\\rangle}{\\sqrt{2}} \\), que se denota como el estado \\(|-\\rangle\\).",
                    "Incorrecto. La compuerta que no altera el estado \\(|1\\rangle\\) es la Identidad."
                ],
                hint: "La compuerta Hadamard crea una superposición, pero con una fase negativa para el estado \\(|1\\rangle\\).",
                theoryHTML: `<h2>La Compuerta de Hadamard (\\(\\hat{H}\\))</h2>
                    <ul>
                        <li><b>Acción:</b> Crea superposiciones. Es la compuerta más importante para iniciar algoritmos cuánticos.</li>
                        <li>\\(\\hat{H}|0\\rangle = \\frac{|0\\rangle+|1\\rangle}{\\sqrt{2}} = |+\\rangle\\)</li>
                        <li>\\(\\hat{H}|1\\rangle = \\frac{|0\\rangle-|1\\rangle}{\\sqrt{2}} = |-\\rangle\\)</li>
                    </ul>`
            },
            {
                question: "Toda compuerta cuántica válida debe ser un operador unitario. Esto se debe a que la evolución cuántica debe:",
                options: [
                    "Ser reversible.",
                    "Preservar la norma del estado.",
                    "Ser representable por una matriz.",
                    "Ser una transformación lineal."
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Si bien la reversibilidad es una consecuencia de la unitariedad, la razón física fundamental es otra.",
                    "¡Correcto! La norma al cuadrado de un estado representa la probabilidad total, que debe ser siempre 1. Los operadores unitarios son precisamente aqueles que garantizan que si \\(\\|\\psi\\| = 1\\), entonces \\(\\|\\hat{U}\\psi\\| = 1\\).",
                    "Incorrecto. No toda matriz representa una evolución cuántica válida.",
                    "Incorrecto. La linealidad es necesaria, pero no suficiente. No todos los operadores lineales son unitarios."
                ],
                hint: "La probabilidad total de un sistema debe conservarse durante su evolución.",
                theoryHTML: `<h2>La Condición para ser una Compuerta Válida</h2>
                    <p><b>El Principio Físico:</b> La aplicación de una compuerta <b>no puede alterar la probabilidad total</b> del sistema. Si un estado comienza con norma 1, debe seguir teniendo norma 1 después de la transformación.</p>
                    <p style="text-align:center;">Si \\( \\|\\psi\\| = 1 \\), entonces \\( \\|\\hat{U}\\psi\\| \\) debe ser \\( 1 \\)</p>
                    <p>Las transformaciones que garantizan esto se llaman <b>unitarias</b>.</p>`
            },
            {
                question: "Un operador \\( \\hat{U} \\) es unitario si cumple la condición:",
                options: [
                    "\\( \\hat{U}^\\dagger = \\hat{U} \\)",
                    "\\( \\hat{U}^\\dagger\\hat{U} = \\hat{I} \\)",
                    "\\( \\hat{U}^2 = \\hat{I} \\)",
                    "\\( \\det(\\hat{U}) = 1 \\)"
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. Esta es la definición de un operador Hermitiano, no unitario. Algunas compuertas (como las Pauli y Hadamard) son ambas, pero no es la definición general.",
                    "¡Correcto! Esta es la definición formal. Un operador es unitario si su adjunto hermitiano (daga) es también su inverso. Multiplicar un operador por su inverso da la identidad.",
                    "Incorrecto. Esta condición (ser su propia inversa) la cumplen algunas compuertas como Pauli-X y Hadamard, pero no todas las compuertas unitarias.",
                    "Incorrecto. Aunque el determinante de una matriz unitaria tiene módulo 1, esta no es la definición."
                ],
                hint: "Un operador unitario es aquel cuyo inverso es igual a su adjunto hermitiano.",
                theoryHTML: `<h2>Operadores Unitarios</h2>
                    <p><b>Definición Formal:</b> Un operador \\(\\hat{U}\\) es <b>Unitario</b> si su daga (adjunto hermitiano) es igual a su inverso.</p>
                    <p style="text-align:center;">\\( \\hat{U}^\\dagger = \\hat{U}^{-1} \\)</p>
                    <p>La forma más común de verificar esto es comprobar si:</p>
                    <p style="text-align:center;">\\( \\hat{U}^\\dagger \\hat{U} = \\hat{I} \\)</p>`
            },
            {
                question: "La operación 'daga' (\\( \\dagger \\)) sobre una matriz consiste en:",
                options: [
                    "Calcular su inversa y luego conjugarla.",
                    "Transponerla y luego conjugarla.",
                    "Conjugarla y luego calcular su inversa.",
                    "Solo transponerla."
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. La inversa y la daga solo son iguales en el caso de operadores unitarios.",
                    "¡Correcto! El adjunto hermitiano o 'daga' de una matriz se calcula obteniendo primero su transpuesta y luego tomando el conjugado complejo de cada elemento.",
                    "Incorrecto. Se debe transponer, no invertir.",
                    "Incorrecto. La transposición por sí sola no es suficiente si la matriz tiene elementos complejos."
                ],
                hint: "La daga es una operación de dos pasos que convierte un vector columna en uno fila.",
                theoryHTML: `<h2>El Adjunto Hermitiano (Daga \\(\\dagger\\))</h2>
                    <p>Consiste en dos pasos: <b>transponer</b> y luego <b>conjugar complejamente</b>.</p>
                    <p><b>Adjunto Hermitiano (\\(\\dagger\\)) = Transponer + Conjugar Complejamente</b></p>
                    <p>Esta es la receta práctica para calcularla en espacios de dimensión finita, donde los operadores se representan por matrices.</p>`
            },
            {
                question: "¿Cuál es el resultado de \\( (\\hat{A}\\hat{B})^\\dagger \\)?",
                options: [
                    "\\( \\hat{A}^\\dagger\\hat{B}^\\dagger \\)",
                    "\\( \\hat{B}^\\dagger\\hat{A}^\\dagger \\)",
                    "\\( \\hat{A}\\hat{B} \\)",
                    "\\( (\\hat{B}\\hat{A})^\\dagger \\)"
                ],
                correctAnswer: 1,
                feedback: [
                    "Incorrecto. La daga de un producto de operadores no es simplemente el producto de las dagas.",
                    "¡Correcto! Una propiedad fundamental del adjunto hermitiano es que invierte el orden del producto. \\((\\hat{A}\\hat{B})^\\dagger = \\hat{B}^\\dagger\\hat{A}^\\dagger\\).",
                    "Incorrecto. Esto solo sería cierto si el producto fuera Hermitiano.",
                    "Incorrecto. Esto sería \\(\\hat{A}^\\dagger\\hat{B}^\\dagger\\), que no es la respuesta correcta."
                ],
                hint: "La daga actúa sobre un producto de manera similar a como lo hace la transposición o la inversión de matrices.",
                theoryHTML: `<h2>Propiedades Generales del Adjunto Hermitiano (\\(\\dagger\\))</h2>
                    <p>Para matrices arbitrarias \\(A\\) y \\(B\\):</p>
                    <ul>
                        <li><b>Aditividad:</b> \\( (A+B)^\\dagger = A^\\dagger + B^\\dagger \\)</li>
                        <li><b>Antilinealidad:</b> \\( (kA)^\\dagger = k^* A^\\dagger \\)</li>
                        <li><b>Producto de Matrices:</b> La daga de un producto invierte el orden.
                        <p style="text-align:center;">\\( (AB)^\\dagger = B^\\dagger A^\\dagger \\)</p></li>
                    </ul>`
            },
            {
                question: "La propiedad de que los operadores unitarios \\( \\hat{U} \\) preservan el producto interior se expresa como:",
                options: [
                    "\\( \\langle \\hat{U}\\psi | \\hat{U}\\phi \\rangle = \\langle \\psi | \\phi \\rangle \\)",
                    "\\( \\langle \\psi | \\hat{U} | \\phi \\rangle = \\langle \\phi | \\hat{U} | \\psi \\rangle \\)",
                    "\\( \\hat{U}\\langle \\psi | \\phi \\rangle = \\langle \\psi | \\phi \\rangle \\)",
                    "\\( \\langle \\hat{U}\\psi | \\phi \\rangle = \\langle \\psi | \\hat{U}\\phi \\rangle \\)"
                ],
                correctAnswer: 0,
                feedback: [
                    "¡Correcto! Esto significa que la 'relación' (proyección y fase relativa) entre dos estados no cambia después de aplicar la misma evolución a ambos. Es como una rotación rígida del espacio de Hilbert.",
                    "Incorrecto. Esta no es una propiedad general de los operadores unitarios.",
                    "Incorrecto. Un operador no puede actuar sobre un escalar (el resultado del producto interior).",

                ],
                hint: "Una compuerta cuántica actúa como una 'rotación rígida' que no altera las relaciones geométricas entre los vectores.",
                theoryHTML: `<h2>Preservar el Producto Interior</h2>
                    <p>Esta propiedad significa que si tomamos dos vectores cualesquiera, \\(|\\psi\\rangle\\) y \\(|\\phi\\rangle\\), y les aplicamos la <b>misma</b> compuerta \\(\\hat{U}\\), el producto interior entre los vectores transformados es <b>idéntico</b> al original.</p>
                    <p style="text-align:center;">\\( \\langle \\hat{U}\\psi | \\hat{U}\\phi \\rangle = \\langle \\psi | \\phi \\rangle \\)</p>
                    <p><b>Demostración:</b> \\( \\langle \\hat{U}\\psi | \\hat{U}\\phi \\rangle = \\langle\\psi|\\hat{U}^\\dagger \\hat{U}|\\phi\\rangle = \\langle\\psi| \\hat{I} |\\phi\\rangle = \\langle\\psi|\\phi\\rangle \\).</p>`
            },
            {
                question: "En la esfera de Bloch, el estado \\( |+\\rangle \\) se encuentra:",
                options: [
                    "En el polo norte.",
                    "En el polo sur.",
                    "En el ecuador, sobre el eje X positivo.",
                    "En el ecuador, sobre el eje Y positivo."
                ],
                correctAnswer: 2,
                feedback: [

                    "¡Correcto! El estado \\(|+\\rangle\\) tiene \\(\\theta=\\pi/2\\) y \\(\\varphi=0\\), lo que lo sitúa en el punto donde el ecuador intersecta el eje X positivo.",

        const quizContentEl = document.getElementById('quiz-content');
        const scoreContainerEl = document.getElementById('score-container');

        const hintSectionEl = document.getElementById('hint-section');
        const modalEl = document.getElementById('theory-modal');
        const modalTextEl = document.getElementById('modal-text');


        function displayQuestion() {
            feedbackPanelEl.style.display = 'none';
            optionsContainerEl.innerHTML = '';
            hintSectionEl.innerHTML = '';

            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];

            questionCounterEl.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            questionTextEl.innerHTML = currentQuestion.question;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = option;
                button.className = 'option-btn';
                button.onclick = () => checkAnswer(index);
                optionsContainerEl.appendChild(button);
            });

            // Add Hint functionality
            const hintBtn = document.createElement('button');
            hintBtn.textContent = 'Necesito una pista';
            hintBtn.className = 'hint-btn';
            const hintText = document.createElement('div');
            hintText.id = 'hint-text';
            hintText.innerHTML = currentQuestion.hint;
            hintBtn.onclick = () => {
                hintText.style.display = 'block';
                hintBtn.style.display = 'none';
            };
            hintSectionEl.appendChild(hintBtn);
            hintSectionEl.appendChild(hintText);

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }

            updateNavButtons();

            if(userAnswers[currentQuestionIndex] !== null){
                showPreviousAnswer();
            }
        }

        function showPreviousAnswer(){
            const userAnswer = userAnswers[currentQuestionIndex];
            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer;
            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            const hintBtn = hintSectionEl.querySelector('.hint-btn');
            if(hintBtn) hintBtn.style.display = 'none';


            optionButtons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === userAnswer.selectedIndex) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            feedbackPanelEl.innerHTML = `<p>${currentQuestion.feedback[userAnswer.selectedIndex]}</p>`;

            const theoryBtn = document.createElement('button');
            theoryBtn.textContent = 'Ver Teoría';
            theoryBtn.className = 'theory-btn';
            theoryBtn.onclick = () => showTheory(currentQuestion.theoryHTML);
            feedbackPanelEl.appendChild(theoryBtn);

            feedbackPanelEl.className = userAnswer.isCorrect ? 'correct-feedback' : 'incorrect-feedback';
            feedbackPanelEl.style.display = 'block';

            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex) {
            if(userAnswers[currentQuestionIndex] !== null) return;

            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correctAnswer;

            userAnswers[currentQuestionIndex] = { selectedIndex, isCorrect };

            if(isCorrect) {
                score++;
            }

            showPreviousAnswer();
        }

        function showTheory(htmlContent) {
            modalTextEl.innerHTML = htmlContent;
            modalEl.style.display = 'flex';
            if (window.MathJax && MathJax.typeset) {
                 MathJax.typeset([modalTextEl]);
            }
        }

        function closeModal() {
            modalEl.style.display = 'none';
        }

        function updateNavButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length -1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                 nextBtn.textContent = 'Siguiente';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function showScore(){
            quizContentEl.style.display = 'none';
            document.querySelector('.navigation-controls').style.display = 'none';
            scoreContainerEl.style.display = 'block';

            scoreTextEl.textContent = `Tu puntuación es ${score} de ${quizData.length}.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;

            scoreContainerEl.style.display = 'none';
            quizContentEl.style.display = 'block';
            document.querySelector('.navigation-controls').style.display = 'flex';

            displayQuestion();
        }

        // Iniciar el cuestionario
        displayQuestion();
