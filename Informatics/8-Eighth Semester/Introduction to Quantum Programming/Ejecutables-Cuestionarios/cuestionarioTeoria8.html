        function displayQuestion() {
            feedbackPanelEl.style.display = 'none';
            optionsContainerEl.innerHTML = '';
            hintSectionEl.innerHTML = '';

            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];

            questionCounterEl.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            questionTextEl.innerHTML = currentQuestion.question;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = option;
                button.className = 'option-btn';
                button.onclick = () => checkAnswer(index);
                optionsContainerEl.appendChild(button);
            });

            // Add Hint functionality
            if(currentQuestion.hint) {
                const hintBtn = document.createElement('button');
                hintBtn.textContent = 'Necesito una pista';
                hintBtn.className = 'hint-btn';
                const hintText = document.createElement('div');
                hintText.id = 'hint-text';
                hintText.innerHTML = currentQuestion.hint;
                hintBtn.onclick = () => {
                    hintText.style.display = 'block';
                    hintBtn.style.display = 'none';
                };
                hintSectionEl.appendChild(hintBtn);
                hintSectionEl.appendChild(hintText);
            }

            // --- CORRECCIÓN ---
            // Usar typesetPromise() para manejar de forma asíncrona el renderizado
            if (window.MathJax && MathJax.typesetPromise) {
                 MathJax.typesetPromise([questionTextEl, optionsContainerEl, hintSectionEl]);
            }

            updateNavButtons();

            if(userAnswers[currentQuestionIndex] !== null){
                showPreviousAnswer();
            }
        }

            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correctAnswer;
            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            const hintBtn = hintSectionEl.querySelector('.hint-btn');
            if(hintBtn) hintBtn.style.display = 'none';


            optionButtons.forEach((btn, i) => {
                if (i === correctIndex) {
                    btn.classList.add('correct');
                } else if (i === userAnswer.selectedIndex) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            feedbackPanelEl.innerHTML = `<p>${currentQuestion.feedback[userAnswer.selectedIndex]}</p>`;

            if (currentQuestion.theoryHTML) {
                const theoryBtn = document.createElement('button');
                theoryBtn.textContent = 'Ver Teoría';
                theoryBtn.className = 'theory-btn';
                theoryBtn.onclick = () => showTheory(currentQuestion.theoryHTML);
                feedbackPanelEl.appendChild(theoryBtn);
            }

            feedbackPanelEl.className = userAnswer.isCorrect ? 'correct-feedback' : 'incorrect-feedback';
            feedbackPanelEl.style.display = 'block';

            // --- CORRECCIÓN ---
            // Usar typesetPromise() para el panel de feedback
            if (window.MathJax && MathJax.typesetPromise) {
                 MathJax.typesetPromise([feedbackPanelEl]);
            }
        }

        function checkAnswer(selectedIndex) {
            if(userAnswers[currentQuestionIndex] !== null) return;

            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correctAnswer;

            userAnswers[currentQuestionIndex] = { selectedIndex, isCorrect };

            if(isCorrect) {
                score++;
            }

            showPreviousAnswer();
        }

        function showTheory(htmlContent) {
            modalTextEl.innerHTML = htmlContent;
            modalEl.style.display = 'flex';

            // --- CORRECCIÓN ---
            // Usar typesetPromise() para el contenido del modal
            if (window.MathJax && MathJax.typesetPromise) {
                 MathJax.typesetPromise([modalTextEl]);
            }
        }

        function closeModal() {
            modalEl.style.display = 'none';
        }

        function updateNavButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length -1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                 nextBtn.textContent = 'Siguiente';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function showScore(){
            quizContentEl.style.display = 'none';
            document.querySelector('.navigation-controls').style.display = 'none';
            scoreContainerEl.style.display = 'block';

            scoreTextEl.textContent = `Tu puntuación es ${score} de ${quizData.length}.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;

            scoreContainerEl.style.display = 'none';
            quizContentEl.style.display = 'block';
            document.querySelector('.navigation-controls').style.display = 'flex';

            displayQuestion();
        }

        // Iniciar el cuestionario
        displayQuestion();
    </script>

</body>
</html>
